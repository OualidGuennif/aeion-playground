name: aeion-playground

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 1m
    max-file: '2'

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
    restart: unless-stopped
    user: '${AEION_OPERATOR_UID:-1000}:${AEION_OPERATOR_GID:-1000}'
    command: [--config=/etc/otelcol/config.yaml]
    ports: ['127.0.0.1:4318:4318', '127.0.0.1:13133:13133']
    networks: [control]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro
      - ./runtime/otel/collector:/data
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=16m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
    ulimits:
      nofile: {soft: 128, hard: 128}
      fsize: {soft: 16777216, hard: 16777216}
    logging: *bounded-logging

  inference-gateway:
    image: aeion-playground-gateway:1
    restart: unless-stopped
    user: '${AEION_OPERATOR_UID:-1000}:${AEION_OPERATOR_GID:-1000}'
    ports: ['127.0.0.1:8130:8130']
    networks: [control, inference]
    secrets: [gateway_admin]
    volumes: ['./runtime/gateway:/data']
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=16m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
    ulimits:
      nofile: {soft: 128, hard: 128}
      fsize: {soft: 16777216, hard: 16777216}
    logging: *bounded-logging
    healthcheck:
      test: [CMD, python, -I, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8130/health',timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    restart: unless-stopped
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_DB: paperclip
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    networks: [workboard]
    volumes: [postgres_data:/var/lib/postgresql/data]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,mode=3777
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    logging: *bounded-logging
    healthcheck:
      test: [CMD-SHELL, pg_isready -U paperclip -d paperclip]
      interval: 2s
      timeout: 5s
      retries: 30

  paperclip:
    restart: unless-stopped
    image: ghcr.io/paperclipai/paperclip@sha256:30894af7ea4a08aaab9921fabe787eabcf1946d608a2460a1eb7a29ea66135bd
    entrypoint: [/usr/bin/tini, -s, --, /bin/sh, /opt/aeion/entrypoint.sh]
    environment:
      HOST: 0.0.0.0
      PORT: '3101'
      SERVE_UI: 'true'
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_AUTH_BASE_URL_MODE: explicit
      PAPERCLIP_BIND: lan
      PAPERCLIP_AUTH_RATE_LIMIT_ENABLED: 'true'
      PAPERCLIP_PUBLIC_URL: http://127.0.0.1:3101
      PAPERCLIP_ALLOWED_HOSTNAMES: paperclip,host.docker.internal
      PAPERCLIP_TELEMETRY_DISABLED: '1'
    secrets: [postgres_password, paperclip_auth, paperclip_actions]
    ports: ['127.0.0.1:3101:3101']
    networks: [workboard, control]
    volumes:
      - paperclip_data:/paperclip
      - ./infra/paperclip-entrypoint.sh:/opt/aeion/entrypoint.sh:ro
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,nodev,size=128m']
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 2
    pids_limit: 512
    stop_grace_period: 90s
    logging: *bounded-logging
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3101/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  cockpit:
    image: aeion-playground-cockpit:1
    build:
      context: .
      dockerfile: infra/cockpit/Dockerfile
    restart: unless-stopped
    user: '${AEION_OPERATOR_UID:-1000}:${AEION_OPERATOR_GID:-1000}'
    environment:
      PAPERCLIP_BASE_URL: http://paperclip:3101
      PAPERCLIP_PUBLIC_URL: http://127.0.0.1:3101
      PAPERCLIP_API_TOKEN_FILE: /run/secrets/paperclip_api_token
      AEION_OTLP_ENDPOINT: http://otel-collector:4318
      AEION_OTLP_ALLOWED_HOSTS: otel-collector
      AEION_OTEL_HEALTH_URL: http://otel-collector:13133
      AEION_EXECUTOR_URL: ${AEION_EXECUTOR_URL:-http://host.docker.internal:8131}
      AEION_EXECUTOR_TOKEN_FILE: /run/secrets/executor_agent
      AEION_MAX_ACTIVE_MISSIONS: '1'
    ports: ['127.0.0.1:8124:8124']
    networks: [control, workboard]
    volumes:
      - ./runtime/cockpit:/app/runtime
      - ./runtime/secrets/executor_agent:/run/secrets/executor_agent:ro
      - ./runtime/secrets/paperclip_api_token:/run/secrets/paperclip_api_token:ro
      - ./config:/app/config:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1024m
    cpus: 2
    pids_limit: 256
    stop_grace_period: 30s
    logging: *bounded-logging
    depends_on:
      otel-collector:
        condition: service_started
      paperclip:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -I, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8124/api/health',timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 24

  parceldesk-api:
    image: aeion-parceldesk-api:1
    build:
      context: ./sandbox/parceldesk/product/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 256
    volumes:
      - parceldesk_data:/data
    networks: [control]
    ports: ['127.0.0.1:8081:8080']
    healthcheck:
      test: [CMD, curl, -fsS, 'http://127.0.0.1:8080/api/health']
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *bounded-logging

  parceldesk-web:
    image: aeion-parceldesk-web:1
    build:
      context: ./sandbox/parceldesk/product/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    environment:
      BACKEND_URL: http://parceldesk-api:8080
      COCKPIT_URL: http://cockpit:8124
    networks: [control]
    ports: ['127.0.0.1:8125:8000']
    depends_on:
      parceldesk-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, deno, eval, "const r=await fetch('http://127.0.0.1:8000/'); if(!r.ok) Deno.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *bounded-logging


networks:
  control: {}
  workboard:
    internal: true
  inference:
    name: aeion-playground-inference
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated

volumes:
  parceldesk_data:
  postgres_data:
  paperclip_data:

secrets:
  gateway_admin:
    file: ./runtime/secrets/gateway_admin
  postgres_password:
    file: ./runtime/secrets/postgres_password
  paperclip_auth:
    file: ./runtime/secrets/paperclip_auth
  paperclip_actions:
    file: ./runtime/secrets/paperclip_actions
