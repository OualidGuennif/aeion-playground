extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32

exporters:
  file/logs:
    path: /data/logs.jsonl
    rotation:
      max_megabytes: 5
      max_backups: 2
  file/traces:
    path: /data/traces.jsonl
    rotation:
      max_megabytes: 5
      max_backups: 2

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [file/logs]
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [file/traces]
