name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --require-hashes -r requirements.lock
      - run: .venv/bin/python scripts/check_publication.py
      - run: .venv/bin/python -m pytest -q

  product-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.5.0
      - name: Product backend tests
        # Use the same Maven/JDK 25 builder as the product Dockerfile.
        run: >-
          docker run --rm
          -v "$PWD/sandbox/parceldesk/product/backend:/src"
          -w /src maven:3.9-eclipse-temurin-25 mvn -B -ntp test
      - name: Product frontend tests
        working-directory: sandbox/parceldesk/product/frontend
        run: deno task test

  docker-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AEION_TEST_BACKEND: docker
      AEION_DOCKER_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --require-hashes -r requirements.lock
      - run: .venv/bin/python scripts/build_worker.py
      - run: .venv/bin/python -m pytest -q

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete public history
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --pids-limit 64 --memory 256m
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          -v "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner

  stack-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --require-hashes -r requirements.lock
      - run: .venv/bin/python scripts/prepare_stack.py
      - run: AEION_OPERATOR_UID=$(id -u) AEION_OPERATOR_GID=$(id -g) docker compose up -d --wait --wait-timeout 420 postgres paperclip cockpit
      - name: Verify real authentication, persistence and database restore
        run: AEION_STACK_TESTS=1 .venv/bin/python -m pytest -q tests/test_compose_stack.py
      - name: Cockpit diagnostics on failure
        if: failure()
        run: docker compose logs --tail=120 cockpit
      - name: Remove this disposable CI stack
        if: always()
        run: docker compose down --volumes

  inference-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --require-hashes -r requirements.lock
      - run: .venv/bin/python scripts/build_agents.py
      - name: Qualify actual OpenCode roles against a controlled local response
        run: AEION_INFERENCE_TESTS=1 .venv/bin/python -m pytest -q tests/test_docker_inference.py

  telemetry-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --require-hashes -r requirements.lock
      - run: .venv/bin/python scripts/prepare_stack.py
      - name: Start the pinned local collector
        run: |
          export AEION_OPERATOR_UID=$(id -u) AEION_OPERATOR_GID=$(id -g)
          docker compose up -d otel-collector
      - name: Verify actual OTLP privacy, outage, duplicate identity and restart recovery
        run: AEION_OTEL_TESTS=1 .venv/bin/python -m pytest -q tests/test_otel_collector.py
      - name: Remove this disposable CI collector
        if: always()
        run: docker compose down --volumes

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m venv .audit
      - run: .audit/bin/python -m pip install --require-hashes -r requirements-audit.lock
      - name: Audit pinned controller, worker and audit dependencies
        run: .audit/bin/python -m pip_audit --disable-pip -r requirements.lock -r infra/worker/requirements.lock -r requirements-audit.lock
      - name: Audit locked OpenCode runtime packages
        run: >-
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges
          --user 65532:65532 --tmpfs /tmp:rw,nosuid,nodev,size=32m --env HOME=/tmp
          --mount type=bind,source="$GITHUB_WORKSPACE/infra/opencode",target=/audit,readonly
          node:24-trixie-slim@sha256:43b9ba1142b8dcf33fa8f922ca1be85714adc444e0586c7cf7726daaeabc1bea
          npm --prefix /audit audit --omit=dev
