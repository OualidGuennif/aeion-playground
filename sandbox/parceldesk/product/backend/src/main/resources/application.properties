quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.banner.enabled=false
quarkus.log.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n

quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:file:/data/parceldesk;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:parceldesk-test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
